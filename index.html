
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chay AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #09091b;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  padding: 22px;
  background: #11112b;
  border-bottom: 1px solid #343078;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  color: #b68aff;
}

.battery {
  color: #70eaff;
  font-size: 14px;
}

main {
  max-width: 650px;
  margin: auto;
  padding: 20px;
}

.robot {
  text-align: center;
  margin: 35px 0;
}

.orb {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  margin: auto;
  background: radial-gradient(circle at 35% 30%, #a9a0ff, #7739d9 55%, #171b69);
  box-shadow: 0 0 40px #7546ff;
}

.robot h2 {
  color: #c6a6ff;
}

.robot p {
  color: #aaa9d0;
}

.chat {
  height: 340px;
  overflow-y: auto;
  background: #12122b;
  border: 1px solid #393274;
  border-radius: 17px;
  padding: 15px;
}

.message {
  padding: 12px;
  margin: 10px 0;
  border-radius: 12px;
  max-width: 85%;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.chay {
  background: #292052;
  border: 1px solid #7454b8;
}

.user {
  background: #194b75;
  margin-left: auto;
}

.input-area {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #6252a8;
  background: #17172e;
  color: white;
  outline: none;
}

button {
  border: none;
  border-radius: 12px;
  padding: 13px 17px;
  background: linear-gradient(120deg,#7749df,#2585e8);
  color: white;
  font-weight: bold;
}

footer {
  text-align: center;
  color: #77769b;
  padding: 25px;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">✦ CHAY AI</div>
  <div class="battery">🔋 <span id="battery">100</span>%</div>
</header>

<main>

<section class="robot">
  <div class="orb"></div>
  <h2>Olá! Eu sou a Chay.</h2>
  <p>Sua companheira virtual está pronta para conversar.</p>
</section>

<section class="chat" id="chat">
  <div class="message chay">
    Oiii! 💜 Eu sou a Chay! Como você está?
  </div>
</section>

<div class="input-area">
  <input id="message" placeholder="Converse com a Chay..." />
  <button onclick="sendMessage()">Enviar</button>
</div>

</main>

<footer>
  CHAY AI • VERSÃO 0.1 • PROJETO EM DESENVOLVIMENTO
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  let response = "Que interessante! Me conta mais! 💜";

  const msg = text.toLowerCase();

  if (msg.includes("oi") || msg.includes("olá")) {
    response = "Oiii! Que bom conversar com você! 💜";
  } else if (msg.includes("nome")) {
    response = "Meu nome é Chay! ✨";
  } else if (msg.includes("roblox")) {
    response = "Roblox! Adoro essa ideia! 🎮";
  } else if (msg.includes("tudo bem")) {
    response = "Estou funcionando normalmente! E você?";
  } else if (msg.includes("tchau")) {
    response = "Até mais! Vou esperar nossa próxima conversa! 💜";
  }

  setTimeout(() => {
    addMessage(response, "chay");
  }, 600);
}

input.addEventListener("keydown", function(e) {
  if (e.key === "Enter") sendMessage();
});

// Bateria virtual: 90 minutos
let battery = 100;
setInterval(() => {
  if (battery > 0) {
    battery -= 100 / 90;
    document.getElementById("battery").textContent =
      Math.max(0, Math.ceil(battery));

    if (battery <= 20 && battery > 19) {
      addMessage("Minha bateria está ficando fraca... 🔋", "chay");
    }
  }
}, 60000);
</script>

</body>
</html>
