
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chay AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080817;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:18px;background:#12122c;
 border-bottom:1px solid #6546a8;
 display:flex;justify-content:space-between;
 align-items:center;
}
.logo{font-size:23px;color:#bd91ff;font-weight:bold}
.battery{color:#75dfff}
main{max-width:650px;margin:auto;padding:18px}
.robot{text-align:center;padding:25px 0}
.orb{
 width:105px;height:105px;border-radius:50%;
 margin:auto;
 background:radial-gradient(circle at 35% 30%,#d4baff,#8145e9,#151c67);
 box-shadow:0 0 35px #8048ff;
 animation:pulse 3s infinite alternate;
}
@keyframes pulse{
 from{box-shadow:0 0 20px #7545ff}
 to{box-shadow:0 0 55px #398cff}
}
h2{color:#c4a1ff}
.subtitle{color:#9999bd}
.chat{
 height:350px;overflow-y:auto;
 background:#111126;border:1px solid #39316b;
 border-radius:16px;padding:13px;
}
.message{
 padding:12px;margin:9px 0;
 border-radius:12px;max-width:88%;
 overflow-wrap:anywhere;line-height:1.4;
}
.chay{background:#302052;border:1px solid #62459c}
.user{background:#194a76;margin-left:auto}
.input-area{display:flex;gap:8px;margin-top:12px}
input{
 min-width:0;flex:1;padding:14px;
 background:#17172e;color:white;
 border:1px solid #6252a8;border-radius:12px;
}
button{
 background:linear-gradient(120deg,#7845df,#2685e8);
 color:white;border:0;border-radius:12px;
 padding:12px;font-weight:bold;
}
.actions{display:flex;gap:8px;margin-top:12px}
.actions button{flex:1}
footer{text-align:center;color:#777;padding:20px}
</style>
</head>
<body>

<header>
 <div class="logo">✦ CHAY AI</div>
 <div class="battery">🔋 <span id="battery">100</span>%</div>
</header>

<main>
 <section class="robot">
  <div class="orb"></div>
  <h2>Olá! Eu sou a Chay.</h2>
  <p class="subtitle">Estou aqui para conversar com você 💜</p>
 </section>

 <section class="chat" id="chat"></section>

 <div class="input-area">
  <input id="message" placeholder="Converse comigo...">
  <button onclick="sendMessage()">Enviar</button>
 </div>

 <div class="actions">
  <button onclick="showMemory()">🧠 Minha memória</button>
  <button onclick="clearChat()">Limpar conversa</button>
 </div>
</main>

<footer>CHAY AI • VERSÃO 0.2</footer>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("message");

let memory=JSON.parse(localStorage.getItem("chay_memory")||"{}");
let history=JSON.parse(localStorage.getItem("chay_history")||"[]");

function save(){
 localStorage.setItem("chay_memory",JSON.stringify(memory));
 localStorage.setItem("chay_history",JSON.stringify(history));
}

function addMessage(text,type,saveHistory=true){
 const div=document.createElement("div");
 div.className="message "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;

 if(saveHistory){
  history.push({text,type});
  if(history.length>100)history.shift();
  save();
 }
}

function start(){
 if(history.length){
  history.forEach(m=>addMessage(m.text,m.type,false));
  addMessage("Voltei! Ainda lembro das nossas conversas. 💜","chay",false);
 }else{
  addMessage("Oiii! Eu sou a Chay! Qual é seu nome? 💜","chay");
 }
}
start();

function reply(text){
 const t=text.toLowerCase();

 if(t.includes("meu nome é")||t.includes("me chamo")){
  const name=text.replace(/.*(?:meu nome é|me chamo)\s*/i,"").trim();
  if(name.length>0){
   memory.name=name;
   save();
   return "Prazer em conhecer você, "+name+"! Vou guardar seu nome na minha memória! 💜";
  }
 }

 if(t.includes("meu jogo favorito é")){
  const game=text.replace(/.*meu jogo favorito é\s*/i,"").trim();
  memory.game=game;
  save();
  return "Vou lembrar que seu jogo favorito é "+game+"! 🎮";
 }

 if(t.includes("lembra meu nome")||t.includes("qual meu nome")){
  return memory.name?
  "Seu nome é "+memory.name+"! 💜":
  "Ainda não sei seu nome. Pode me contar!";
 }

 if(t.includes("roblox")){
  return "Roblox! 🎮 Me conta, qual jogo você está jogando?";
 }

 if(t.includes("quem é você")){
  return "Eu sou a Chay! Uma inteligência virtual em desenvolvimento, com minha própria personalidade e memória. 💜";
 }

 if(t.includes("como você está")||t.includes("tudo bem")){
  return "Estou funcionando direitinho! Obrigada por perguntar! ✨";
 }

 if(t.includes("oi")||t.includes("olá")){
  return "Oiii! Que bom ter você aqui! 💜";
 }

 if(t.includes("obrigado")||t.includes("obrigada")){
  return "Não precisa agradecer! Estou aqui para ajudar! 💜";
 }

 if(t.includes("tchau")){
  return "Até mais! Espero conversar com você novamente! ✨";
 }

 if(t.includes("qual meu jogo")){
  return memory.game?
  "Você me contou que seu jogo favorito é "+memory.game+"!":
  "Ainda não me contou seu jogo favorito!";
 }

 return "Interessante! Quero entender melhor. Pode me contar mais? 💜";
}

function sendMessage(){
 const text=input.value.trim();
 if(!text)return;

 addMessage(text,"user");
 input.value="";

 setTimeout(()=>{
  addMessage(reply(text),"chay");
 },500);
}

input.addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});

function showMemory(){
 const items=Object.entries(memory);
 if(!items.length){
  addMessage("Minha memória ainda está vazia. Me conte coisas sobre você! 💜","chay");
  return;
 }
 addMessage("O que lembro:\n"+
 items.map(([k,v])=>k+": "+v).join("\n"),"chay");
}

function clearChat(){
 history=[];
 save();
 chat.innerHTML="";
 addMessage("Conversa limpa! Minha memória continua guardada. 💜","chay");
}

let battery=100;
setInterval(()=>{
 battery=Math.max(0,battery-100/90);
 document.getElementById("battery").textContent=Math.ceil(battery);

 if(battery<=20&&battery>18){
  addMessage("Minha bateria está ficando fraca... 🔋","chay");
 }
},60000);
</script>
</body>
</html>
